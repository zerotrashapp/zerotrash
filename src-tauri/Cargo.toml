[package]
name = "zerotrash"
version = "1.0.0"
description = "ZeroTrash — Next-Gen Cross-Platform Uninstaller & Deep Cleaner"
authors = ["Spiros & Antigravity"]
edition = "2021"
default-run = "zerotrash"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[lib]
name = "zerotrash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zerotrash"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "zerotrash-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
